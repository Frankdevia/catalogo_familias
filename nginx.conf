server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/xml application/xml+rss;

  # Los assets de /_astro/ llevan un hash en el nombre: si el contenido
  # cambia, cambia la URL. Por eso pueden cachearse para siempre.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # El HTML no se cachea: es lo que hace que un negocio nuevo aparezca
  # de inmediato tras un despliegue.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ $uri/index.html =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
    add_header Cache-Control "no-cache";
  }
}
