# El sitio vivió en el host que EasyPanel genera por defecto antes de tener
# dominio propio. Ese host sigue resolviendo, y hay al menos un correo enviado a
# una familia con un enlace a él, más lo que Google haya indexado. Redirigir
# cuesta cinco líneas y evita que esos enlaces mueran.
#
# Va en un `server` aparte y no en un `if`: nginx elige el bloque por
# `server_name`, que es más barato y no tiene las sorpresas del `if`.
server {
  listen 80;
  server_name catologonegocios.26zlav.easypanel.host;
  return 301 https://comunidad.liceoingles.edu.co$request_uri;
}

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/xml application/xml+rss;

  # Los assets de /_astro/ llevan un hash en el nombre: si el contenido
  # cambia, cambia la URL. Por eso pueden cachearse para siempre.
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # El HTML no se cachea: es lo que hace que un negocio nuevo aparezca
  # de inmediato tras un despliegue.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ $uri/index.html =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
    add_header Cache-Control "no-cache";
  }
}
